# NOT USED by scripts/generate-sdks.sh. The TypeScript SDK
# (../queueflow-sdk-nodejs) regenerates its own generated core/ from this
# spec with `npm run generate-core` and keeps a hand-written facade, worker
# runtime, and SSE watcher in src/. Kept for reference only;
# scripts/check-ts-sdk.mjs guards that repo against spec drift.
#
generatorName: typescript-fetch
additionalProperties:
  npmName: "@queueflow/sdk"
  npmVersion: 0.2.0
  npmRepository: https://github.com/elision-labs/queueflow-sdk-nodejs
  supportsES6: true
  withInterfaces: true
  typescriptThreePlus: true
  modelPropertyNaming: original
  hideGenerationTimestamp: true
