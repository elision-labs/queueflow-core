# openapi-generator config for the Rust SDK.
#
# Generates the core (apis + models, async reqwest) AND injects the
# hand-written ergonomic facade as a supporting file
# (sdk-templates/rust/facade.mustache), so the crate ships `QueueFlow`,
# `wait_for_job`/`wait_for_workflow`, and a workflow builder that raw codegen
# cannot emit. templateDir also overrides Cargo.mustache (named authors, repo
# metadata, tokio + dev deps for the facade and its tests) and lib.mustache
# (declares the facade module); every other template falls back to the
# generator's built-in default.
generatorName: rust
# Baked into git_push.sh and the README; matches the actual GitHub remote.
# The crate is `queueflow-sdk`: the bare `queueflow` crates.io name belongs to
# the server/CLI binary (see queueflow-core PUBLISHING.md).
gitHost: github.com
gitUserId: elision-labs
gitRepoId: queueflow-sdk-rust
templateDir: /templates
files:
  facade.mustache:
    destinationFilename: src/facade.rs
    templateType: SupportingFiles
  facade-readme.mustache:
    destinationFilename: FACADE.md
    templateType: SupportingFiles
additionalProperties:
  packageName: queueflow-sdk
  packageVersion: 0.2.1
  hideGenerationTimestamp: true
  # Rendered into Cargo.toml [package] by the Cargo.mustache override.
  repositoryUrl: https://github.com/elision-labs/queueflow-sdk-rust
  homePageUrl: https://queueflow.dev
