openapi: 3.1.0
info:
  title: QueueFlow API
  description: REST API for QueueFlow, a PostgreSQL/PGMQ-native distributed job queue and workflow engine.
  contact:
    name: QueueFlow
    url: https://queueflow.dev
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 1.0.0
servers:
- url: http://localhost:8000
  description: Local development
- url: https://api.queueflow.dev
  description: Production
paths:
  /api/v1/jobs:
    get:
      tags:
      - jobs
      operationId: listJobs
      parameters:
      - name: status
        in: query
        description: Filter by status (e.g. `pending`, `completed`).
        required: false
        schema:
          type: string
      - name: queue
        in: query
        description: Filter by queue name (jobs only).
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1..=100 (default 50).
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: Number of records to skip (default 0).
        required: false
        schema:
          type: integer
          format: int64
      - name: order_by
        in: query
        description: '`created_at ASC` or `created_at DESC` (default DESC).'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Page of jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListJobsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearerAuth: []
    post:
      tags:
      - jobs
      operationId: createJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
        required: true
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateJobResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearerAuth: []
  /api/v1/jobs/batch:
    post:
      tags:
      - jobs
      operationId: createBatchJobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchJobsRequest'
        required: true
      responses:
        '201':
          description: Jobs created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBatchJobsResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearerAuth: []
  /api/v1/jobs/{id}:
    get:
      tags:
      - jobs
      operationId: getJob
      parameters:
      - name: id
        in: path
        description: Job id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearerAuth: []
  /api/v1/jobs/{id}/cancel:
    post:
      tags:
      - jobs
      operationId: cancelJob
      parameters:
      - name: id
        in: path
        description: Job id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Cancelled
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearerAuth: []
  /api/v1/stats:
    get:
      tags:
      - system
      operationId: getStats
      responses:
        '200':
          description: Engine counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsSnapshot'
      security:
      - bearerAuth: []
  /api/v1/tasks:
    get:
      tags:
      - system
      operationId: listTasks
      responses:
        '200':
          description: Registered task handlers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksResponse'
      security:
      - bearerAuth: []
  /api/v1/workflows:
    get:
      tags:
      - workflows
      operationId: listWorkflows
      parameters:
      - name: status
        in: query
        description: Filter by status (e.g. `pending`, `completed`).
        required: false
        schema:
          type: string
      - name: queue
        in: query
        description: Filter by queue name (jobs only).
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1..=100 (default 50).
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: Number of records to skip (default 0).
        required: false
        schema:
          type: integer
          format: int64
      - name: order_by
        in: query
        description: '`created_at ASC` or `created_at DESC` (default DESC).'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Page of workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearerAuth: []
    post:
      tags:
      - workflows
      operationId: createWorkflow
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
        required: true
      responses:
        '201':
          description: Workflow created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkflowResponse'
        '400':
          description: Invalid workflow (e.g. dependency cycle)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearerAuth: []
  /api/v1/workflows/{id}:
    get:
      tags:
      - workflows
      operationId: getWorkflow
      parameters:
      - name: id
        in: path
        description: Workflow id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearerAuth: []
  /api/v1/workflows/{id}/cancel:
    post:
      tags:
      - workflows
      operationId: cancelWorkflow
      parameters:
      - name: id
        in: path
        description: Workflow id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Cancelled
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearerAuth: []
  /api/v1/workflows/{id}/diagram:
    get:
      tags:
      - workflows
      operationId: getWorkflowDiagram
      parameters:
      - name: id
        in: path
        description: Workflow id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Mermaid diagram of the workflow DAG
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDiagramResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearerAuth: []
  /health:
    get:
      tags:
      - health
      operationId: getHealth
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /ready:
    get:
      tags:
      - health
      operationId: getReady
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyStatus'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
components:
  schemas:
    BackoffStrategy:
      type: string
      description: How retry delays grow between attempts.
      enum:
      - fixed
      - linear
      - exponential
    CreateBatchJobsRequest:
      type: object
      required:
      - jobs
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/CreateJobRequest'
    CreateBatchJobsResponse:
      type: object
      required:
      - job_ids
      - count
      properties:
        count:
          type: integer
          minimum: 0
        job_ids:
          type: array
          items:
            type: string
    CreateJobRequest:
      type: object
      required:
      - task_name
      properties:
        config:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/JobConfigRequest'
        payload:
          type: object
          description: Arbitrary JSON object passed to the handler.
        task_name:
          type: string
          description: The registered task handler to invoke.
    CreateJobResponse:
      type: object
      required:
      - job_id
      properties:
        job_id:
          type: string
    CreateWorkflowRequest:
      type: object
      description: |-
        Request body for creating a workflow. Shared by the builder DSL and the API
        so callers and SDKs use the same contract as the Go server.
      required:
      - name
      - steps
      properties:
        context:
          type: object
        metadata:
          type: object
        name:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'
    CreateWorkflowResponse:
      type: object
      required:
      - workflow_id
      properties:
        workflow_id:
          type: string
    ErrorBody:
      type: object
      required:
      - error
      - timestamp
      properties:
        error:
          type: string
        timestamp:
          type: string
          format: date-time
    HealthStatus:
      type: object
      required:
      - status
      - timestamp
      - version
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        version:
          type: string
    Job:
      type: object
      description: A single unit of work.
      required:
      - id
      - queue_name
      - task_name
      - config
      - status
      - created_at
      - retry_count
      properties:
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        config:
          $ref: '#/components/schemas/JobConfig'
        created_at:
          type: string
          format: date-time
        error_message:
          type:
          - string
          - 'null'
        id:
          type: string
        metadata:
          type: object
        next_retry_at:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            When this job becomes visible again for a retry. Audit/inspection only —
            the actual scheduling is owned by the message queue's delayed delivery.
        payload:
          type: object
        queue_name:
          type: string
        result:
          type:
          - object
          - 'null'
        retry_count:
          type: integer
          format: int32
          minimum: 0
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          $ref: '#/components/schemas/JobStatus'
        task_name:
          type: string
        tenant_id:
          type:
          - string
          - 'null'
        workflow_id:
          type:
          - string
          - 'null'
        workflow_step_id:
          type:
          - string
          - 'null'
          description: The owning workflow step's name (steps are addressed by name).
    JobConfig:
      type: object
      description: Per-job execution configuration. All durations are in seconds.
      required:
      - max_retries
      - retry_delay_secs
      - timeout_secs
      - priority
      - retry_max_delay_secs
      properties:
        jitter_factor:
          type:
          - number
          - 'null'
          format: double
          description: |-
            Optional jitter in `0.0..=1.0`. `0.1` => +/-10% randomization of each
            retry delay, which spreads out thundering-herd retries.
        max_retries:
          type: integer
          format: int32
          minimum: 0
        priority:
          type: integer
          format: int32
        retry_backoff:
          $ref: '#/components/schemas/BackoffStrategy'
        retry_delay_secs:
          type: integer
          format: int64
          minimum: 0
        retry_max_delay_secs:
          type: integer
          format: int64
          minimum: 0
        timeout_secs:
          type: integer
          format: int64
          minimum: 0
    JobConfigRequest:
      type: object
      description: Optional per-job configuration overrides.
      properties:
        max_retries:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        priority:
          type:
          - integer
          - 'null'
          format: int32
          description: Higher is dequeued first (FIFO within a priority on PGMQ).
        queue:
          type:
          - string
          - 'null'
          description: Override the destination queue.
        timeout:
          type:
          - integer
          - 'null'
          format: int64
          description: Per-attempt timeout, in seconds.
          minimum: 0
    JobStatus:
      type: string
      description: Lifecycle state of a single job.
      enum:
      - pending
      - running
      - completed
      - failed
      - retrying
      - cancelled
    ListJobsResponse:
      type: object
      required:
      - jobs
      - total
      - limit
      - offset
      - has_more
      properties:
        has_more:
          type: boolean
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        limit:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    ListWorkflowsResponse:
      type: object
      required:
      - workflows
      - total
      - limit
      - offset
      - has_more
      properties:
        has_more:
          type: boolean
        limit:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/Workflow'
    OnFailure:
      type: string
      description: What to do with downstream steps when a step fails.
      enum:
      - halt
      - skip
      - continue
    OnSuccess:
      type: string
      description: Reserved for future expansion; only `Continue` is meaningful today.
      enum:
      - continue
    ReadyStatus:
      type: object
      required:
      - status
      properties:
        status:
          type: string
    StatsSnapshot:
      type: object
      description: Plain snapshot of [`EngineStats`].
      required:
      - jobs_created
      - jobs_completed
      - jobs_failed
      - jobs_retried
      - jobs_dead_lettered
      - workflows_created
      - workflows_completed
      - workflows_failed
      properties:
        jobs_completed:
          type: integer
          format: int64
          minimum: 0
        jobs_created:
          type: integer
          format: int64
          minimum: 0
        jobs_dead_lettered:
          type: integer
          format: int64
          minimum: 0
        jobs_failed:
          type: integer
          format: int64
          minimum: 0
        jobs_retried:
          type: integer
          format: int64
          minimum: 0
        workflows_completed:
          type: integer
          format: int64
          minimum: 0
        workflows_created:
          type: integer
          format: int64
          minimum: 0
        workflows_failed:
          type: integer
          format: int64
          minimum: 0
    TasksResponse:
      type: object
      required:
      - tasks
      properties:
        tasks:
          type: array
          items:
            type: string
    Workflow:
      type: object
      description: A workflow instance and its steps.
      required:
      - id
      - name
      - steps
      - status
      - created_at
      properties:
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        context:
          type: object
          description: |-
            Accumulated step results, keyed by step name. Passed to downstream steps
            under the `_context` payload key.
        created_at:
          type: string
          format: date-time
        id:
          type: string
        metadata:
          type: object
        name:
          type: string
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'
        tenant_id:
          type:
          - string
          - 'null'
    WorkflowDiagramResponse:
      type: object
      required:
      - format
      - diagram
      properties:
        diagram:
          type: string
          description: The diagram document (Mermaid `graph TD`).
        format:
          type: string
          description: Diagram source format. Always `mermaid` today.
    WorkflowStatus:
      type: string
      description: Lifecycle state of a workflow instance.
      enum:
      - created
      - running
      - completed
      - failed
      - partially_failed
      - cancelled
    WorkflowStep:
      type: object
      description: |-
        A node in a workflow DAG. Steps are addressed by their unique `name`;
        `depends_on` lists the names of steps that must complete first.
      required:
      - name
      - task_name
      properties:
        config:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/JobConfig'
        depends_on:
          type: array
          items:
            type: string
        metadata:
          type: object
        name:
          type: string
        on_failure:
          $ref: '#/components/schemas/OnFailure'
        on_success:
          $ref: '#/components/schemas/OnSuccess'
        payload:
          type: object
        task_name:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
tags:
- name: health
  description: Liveness and readiness probes
- name: jobs
  description: Job lifecycle
- name: workflows
  description: Workflow orchestration (DAG of steps)
- name: system
  description: Introspection and metrics
