# Render Blueprint: QueueFlow (prebuilt GHCR image) + Render Postgres.
#
# Spec reference: https://render.com/docs/blueprint-spec
# Schema used to verify field names: https://render.com/schema/render.yaml.json
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick the repo containing this
# file. The two `sync: false` variables are prompted for at creation time and
# are never stored in Git. Full walkthrough: deploy/render/README.md
#
# Render routes public HTTPS traffic to one port only, so only the API (8000)
# is exposed; Prometheus metrics on 9090 are not reachable from outside.

services:
  - type: web
    name: queueflow
    runtime: image
    image:
      url: ghcr.io/elision-labs/queueflow:0.2
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      # Render detects the listening port from PORT; QueueFlow reads its own
      # QUEUEFLOW_API_PORT, so both are pinned to 8000.
      - key: PORT
        value: 8000
      - key: QUEUEFLOW_API_PORT
        value: 8000
      - key: QUEUEFLOW_MODE
        value: all
      - key: QUEUEFLOW_WORKERS
        value: 10
      - key: RUST_LOG
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: queueflow-db
          property: connectionString
      # Tenant API keys, "token:tenant[,token2:tenant2]". Prompted at creation.
      - key: QUEUEFLOW_API_KEYS
        sync: false
      # Worker-protocol credential (lease/heartbeat/complete/fail). Random
      # 256-bit value generated by Render on first deploy.
      - key: QUEUEFLOW_WORKER_TOKEN
        generateValue: true
      # Optional: comma-separated browser origins. Leave unset for server-only use.
      # - key: QUEUEFLOW_CORS_ORIGINS
      #   value: https://app.example.com

databases:
  - name: queueflow-db
    plan: basic-256mb
    region: oregon
    databaseName: queueflow
    user: queueflow
    postgresMajorVersion: "16"
