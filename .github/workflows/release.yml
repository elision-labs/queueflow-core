name: Release

# Cut a release by pushing a tag like v0.1.0.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release + upload assets
  packages: write # push the container image to GHCR
  id-token: write # crates.io Trusted Publishing (OIDC) for the publish job

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/queueflow

jobs:
  publish-crates:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      # crates.io Trusted Publishing: each of the four crates lists this
      # repository + this workflow file as a trusted publisher on crates.io,
      # and the auth action exchanges GitHub's OIDC token for one short-lived
      # publish token that is valid for all of them. No long-lived secret.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: "Publish (ordered: core -> api -> client -> queueflow)"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: ./scripts/publish-crates.sh

  binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p queueflow --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/queueflow
          tar -C "$(dirname "$bin")" -czf "queueflow-${{ matrix.target }}.tar.gz" queueflow
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: queueflow-${{ matrix.target }}.tar.gz

  # The OpenAPI spec is a release artifact: consumers who want a Python/Go/etc.
  # client generate one themselves against this pinned spec (see README "SDKs"),
  # so every release ships the exact contract it serves.
  spec:
    name: OpenAPI spec artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Generate spec from code
        run: cargo run -q -p queueflow -- spec --output-dir spec
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            spec/openapi.json
            spec/openapi.yaml

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
