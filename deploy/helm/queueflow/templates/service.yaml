apiVersion: v1
kind: Service
metadata:
  name: {{ include "queueflow.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "queueflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ include "queueflow.apiComponent" . }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "queueflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ include "queueflow.apiComponent" . }}
{{- if and (eq .Values.mode "split") .Values.service.workerMetrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "queueflow.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "queueflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "queueflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
{{- end }}
