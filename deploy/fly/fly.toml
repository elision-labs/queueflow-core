# fly.toml for QueueFlow on Fly.io, deploying the prebuilt GHCR image.
#
# Config reference: https://docs.fly.io/reference/configuration
# Secrets:          https://docs.fly.io/apps/secrets/
# Setup steps and secrets commands: README.md next to this file.
#
# Replace the app name, then from this directory:
#   fly launch --copy-config --no-deploy        (or: fly apps create <name>)
#   fly secrets set DATABASE_URL=... QUEUEFLOW_API_KEYS=... QUEUEFLOW_WORKER_TOKEN=...
#   fly deploy

app = "queueflow"
primary_region = "ord"

# SIGTERM then up to 60s for in-flight handlers to drain (the binary bounds
# its own drain at 30s).
kill_signal = "SIGTERM"
kill_timeout = 60

[build]
  image = "ghcr.io/elision-labs/queueflow:0.2"

# Non-secret configuration. DATABASE_URL, QUEUEFLOW_API_KEYS and
# QUEUEFLOW_WORKER_TOKEN come from `fly secrets set`, never from this file.
[env]
  QUEUEFLOW_MODE = "all"
  QUEUEFLOW_API_PORT = "8000"
  QUEUEFLOW_METRICS_PORT = "9090"
  QUEUEFLOW_WORKERS = "10"
  RUST_LOG = "info"
  # QUEUEFLOW_CORS_ORIGINS = "https://app.example.com"
  # QUEUEFLOW_RETENTION_HOURS = "168"

# Run migrations once per deploy in a throwaway Machine before the new
# release rolls out. release_command replaces CMD but keeps the image's
# ENTRYPOINT (`queueflow`), so this runs `queueflow migrate`. Comment it out
# to let the server migrate on startup instead (and remove --auto-migrate
# below).
[deploy]
  release_command = "migrate"
  strategy = "rolling"

# A job queue must not be stopped when idle: workers, cron and the janitor
# only run while the Machine is up.
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

  # /ready: engine accepting work and Postgres answering.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "3s"
    method = "GET"
    path = "/ready"

  # /health: process up and Postgres reachable.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "3s"
    method = "GET"
    path = "/health"

# Prometheus metrics stay on the private network only (no [[services]] entry
# for 9090). Fly's built-in Prometheus scrapes them via [metrics]; you can also
# reach http://<app>.internal:9090/metrics over the private 6PN network.
[metrics]
  port = 9090
  path = "/metrics"

# Process commands supersede the image CMD but keep its ENTRYPOINT
# (`queueflow`), so this runs `queueflow serve ...`.
[processes]
  app = "serve --mode all --auto-migrate false"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]
