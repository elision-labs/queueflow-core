[package]
name = "queueflow"
description = "QueueFlow server and CLI: a PostgreSQL-native job queue and workflow engine (REST API, workers, metrics, OpenAPI spec generation)."
readme = "README.md"
keywords = ["queue", "jobs", "postgres", "workflow", "server"]
categories = ["command-line-utilities", "asynchronous", "database"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# The package is named after its binary: `cargo install queueflow` installs
# the `queueflow` command (src/main.rs is the auto-discovered bin target).

[dependencies]
queueflow-core = { workspace = true, features = ["postgres"] }
queueflow-api = { workspace = true }
queueflow-client = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
utoipa = { workspace = true }
